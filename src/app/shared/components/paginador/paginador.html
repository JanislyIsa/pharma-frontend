<nav class="paginador" aria-label="Paginación">
  <span class="resumen" data-testid="resumen-paginacion">{{ desde() }}–{{ hasta() }} de {{ totalElementos() }}</span>
  <label>Filas
    <select [disabled]="deshabilitado()" (change)="cambioTamanio.emit(+$any($event.target).value)">
      @for (t of opciones(); track t) { <option [value]="t" [selected]="t === tamanio()">{{ t }}</option> }
    </select>
  </label>
  <button type="button" (click)="ir(0)" [disabled]="esPrimera() || deshabilitado()" aria-label="Primera página">«</button>
  <button type="button" (click)="ir(pagina() - 1)" [disabled]="esPrimera() || deshabilitado()">Anterior</button>
  <span data-testid="pagina-actual" aria-live="polite">Página {{ pagina() + 1 }} de {{ totalPaginas() || 1 }}</span>
  <button type="button" (click)="ir(pagina() + 1)" [disabled]="esUltima() || deshabilitado()">Siguiente</button>
  <button type="button" (click)="ir(totalPaginas() - 1)" [disabled]="esUltima() || deshabilitado()" aria-label="Última página">»</button>
</nav>
