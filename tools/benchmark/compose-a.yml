name: pharma-s13-a
services:
  benchmark:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8083:80"
      - "127.0.0.1:8084:81"
    volumes:
      - ../../tmp/s13-autonoma/no-preload/browser:/bench/no-preload:ro
      - ../../tmp/s13-autonoma/preload/browser:/bench/preload:ro
      - ./nginx-a.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "backend:host-gateway"
